name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: recsys run --config configs/smoke.json --output artifacts/ci-smoke
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          OPENBLAS_NUM_THREADS: "2"
      - run: python -m recsys_auto.audit --experiment artifacts/ci-smoke
      - run: python -m recsys_auto.from_static --experiment artifacts/ci-smoke --config configs/ci_from_static.json
      - run: python -m recsys_auto.statistics --experiment artifacts/ci-smoke

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-auto-features"
version = "0.1.0"
description = "Воспроизводимый поиск исторических признаков для рекомендательных моделей"
requires-python = ">=3.11"
dependencies = [
  "catboost==1.2.8", "numpy==2.2.6", "pandas==2.3.3",
  "scikit-learn==1.7.2", "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
recsys = "recsys_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
